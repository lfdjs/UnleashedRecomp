name: Portable Runtime validation

on:
  push:
    branches: [portable]
    paths:
      - "UnleashedRecomp/portable/**"
      - "UnleashedRecomp/main.cpp"
      - "UnleashedRecomp/kernel/**"
      - "UnleashedRecomp/cpu/**"
      - "UnleashedRecomp/apu/**"
      - "UnleashedRecomp/hid/**"
      - "UnleashedRecomp/os/**"
      - "UnleashedRecomp/user/paths.cpp"
      - "UnleashedRecomp/ui/installer_wizard.cpp"
      - "UnleashedRecomp/CMakeLists.txt"
      - "thirdparty/CMakeLists.txt"
      - "tools/validate-portable-runtime.sh"
      - "tools/tests/**"
      - "cmake/ResolveVcpkgRoot.cmake"
      - "CMakeLists.txt"
      - "tools/validate-linux-runtime.sh"
      - ".github/workflows/portable-runtime.yml"
  pull_request:
    paths:
      - "UnleashedRecomp/portable/**"
      - "UnleashedRecomp/kernel/**"
      - "UnleashedRecomp/cpu/**"
      - "UnleashedRecomp/os/**"
      - "UnleashedRecomp/CMakeLists.txt"
      - ".github/workflows/portable-runtime.yml"
  workflow_dispatch:
    inputs:
      run_macos:
        description: "Try macOS runner / Tentar runner macOS"
        required: false
        default: false
        type: boolean

# EN: Validate the latest branch revision, cancel superseded runs.
# PT-BR: Valida a revisao mais recente e cancela execucoes obsoletas.
concurrency:
  group: portable-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-units:
    name: Units (${{ matrix.os }} / ${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax / Sintaxe bash
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n tools/build-switch-nro.sh
          bash -n tools/generate-switch-app-shaders.sh
          bash -n tools/validate-portable-runtime.sh
          bash -n tools/tests/test-vcpkg-regeneration.sh
          bash tools/tests/test-vcpkg-regeneration.sh
          bash -n tools/validate-linux-runtime.sh
      - name: Configure / Configurar
        run: cmake -S UnleashedRecomp/portable/tests -B build/portable-tests -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build / Compilar
        run: cmake --build build/portable-tests --config ${{ matrix.build_type }} --parallel 2
      - name: Test / Testar
        run: ctest --test-dir build/portable-tests -C ${{ matrix.build_type }} --output-on-failure

  # EN: Compile the SDL diagnostic module without licensed game content.
  # PT-BR: Compila o diagnostico SDL sem precisar de arquivos do jogo.
  sdl-diagnostics-syntax:
    name: Linux SDL/Vulkan preflight syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL 2 development headers
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Compile portable diagnostics without game assets
        shell: bash
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror -IUnleashedRecomp \
            $(pkg-config --cflags sdl2) -fsyntax-only \
            UnleashedRecomp/portable/diagnostics.cpp
      - name: Link and exercise SDL preflight without game assets
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          # EN: In headless CI, Vulkan may fail; check the stable report and bitmask.
          # PT-BR: No CI sem tela, Vulkan pode falhar; valida o relatorio e os bits.
          clang++ -std=c++20 -IUnleashedRecomp \
            $(pkg-config --cflags sdl2) \
            UnleashedRecomp/portable/diagnostics.cpp \
            UnleashedRecomp/portable/memory.cpp \
            UnleashedRecomp/portable/tests/sdl_preflight_smoke.cpp \
            $(pkg-config --libs sdl2) \
            -o "${RUNNER_TEMP}/portable-sdl-preflight"
          "${RUNNER_TEMP}/portable-sdl-preflight" > "${RUNNER_TEMP}/portable-sdl-preflight.log"
          grep -q 'PORTABLE_PREFLIGHT_BEGIN|version=1' "${RUNNER_TEMP}/portable-sdl-preflight.log"
          grep -q 'PORTABLE_CHECK|guest-memory|PASS' "${RUNNER_TEMP}/portable-sdl-preflight.log"
          grep -q 'PORTABLE_CHECK|guest-memory|FAIL' "${RUNNER_TEMP}/portable-sdl-preflight.log"
          grep -q 'PORTABLE_PREFLIGHT_END|exit_code=' "${RUNNER_TEMP}/portable-sdl-preflight.log"
          cat "${RUNNER_TEMP}/portable-sdl-preflight.log"

  # EN: Build and initialize the exact pinned nativefiledialog portal
  #     backend without game assets or an attached graphics device.
  # PT-BR: Compila e inicia o backend portal exato do submodulo, sem
  #     dados do jogo nem GPU fisica.
  linux-file-dialog-portal:
    name: Linux native file dialog (D-Bus portal)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Initialize pinned nativefiledialog
        shell: bash
        run: git submodule update --init thirdparty/nativefiledialog-extended
      - name: Install D-Bus headers and tools
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev dbus-x11
      - name: Configure pinned portal backend
        run: cmake -S thirdparty/nativefiledialog-extended -B build/nfd-portal -DCMAKE_BUILD_TYPE=Debug -DNFD_PORTAL=ON -DNFD_BUILD_TESTS=OFF -DNFD_INSTALL=OFF
      - name: Compile nativefiledialog portal
        run: cmake --build build/nfd-portal --target nfd --parallel 2
      - name: Verify NFD_Init over a temporary D-Bus session
        shell: bash
        run: |
          # EN: Test portal initialization, not an interactive chooser.
          # PT-BR: Testa a inicializacao, nao uma janela interativa.
          c++ -std=c++20 -Ithirdparty/nativefiledialog-extended/src/include \
            tools/tests/nfd_portal_smoke.cpp build/nfd-portal/src/libnfd.a \
            $(pkg-config --libs dbus-1) -o build/nfd-portal/nfd_portal_smoke
          dbus-run-session -- build/nfd-portal/nfd_portal_smoke

  # EN: Catch memory safety and undefined behavior regressions in the portable tests.
  # PT-BR: Detecta regressoes de memoria e comportamento indefinido nos testes.
  portable-sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S UnleashedRecomp/portable/tests -B build/portable-sanitizers -DCMAKE_BUILD_TYPE=Debug -DPORTABLE_ENABLE_SANITIZERS=ON
      - run: cmake --build build/portable-sanitizers --parallel 2
      - run: ctest --test-dir build/portable-sanitizers --output-on-failure

  # EN: Compile native code-generation tools with only their required submodules.
  # PT-BR: Compila geradores nativos com os submodulos necessarios.
  host-generators:
    name: Linux native host generators
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize compiler submodules
        shell: bash
        run: git submodule update --init --recursive tools/XenonRecomp tools/XenosRecomp
      - name: Configure generators
        # EN: XenonRecomp has anonymous aggregate members accepted by Clang,
        #     but rejected by GCC's stricter parsing of this C++ extension.
        # PT-BR: O XenonRecomp usa agregados anonimos aceitos pelo Clang,
        #     mas rejeitados pelo GCC na sintaxe usada pelo submodulo.
        run: cmake -S . -B build/host-tools -DUNLEASHED_RECOMP_HOST_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build generators
        run: cmake --build build/host-tools --parallel 2 --target file_to_c x_decompress XenonRecomp XenosRecomp

  # EN: Previous macOS jobs were cancelled by the runner; keep manual validation.
  # PT-BR: Jobs macOS anteriores foram cancelados; mantem validacao manual.
  macos-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos
    name: macOS manual unit tests
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S UnleashedRecomp/portable/tests -B build/portable-tests -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/portable-tests --parallel 2
      - run: ctest --test-dir build/portable-tests --output-on-failure
